  </head>

    let flex = document.getElementById("flex");
    let url_divs = [];
    for (const url of urls) {
      let a= document.createElement('a');
      let l = document.createTextNode(url.label);
      a.appendChild(l);
      a.title = url.label;
      a.href = url.url;
      flex.appendChild(a);
      url_divs.push(a);
    }
    document.getElementById("filter").value = "";

    function filter(event) {
      <!-- console.log(url_divs); -->
      let filter = new RegExp(event.target.value, "i");
      for (const url_div of url_divs) {
        if (url_div.text.match(filter)) {
          <!-- url_div.style.display = "inherit"; -->
          url_div.style.visibility = "inherit";
        }
        else {
          url_div.style.visibility = "hidden";
        }
      }
    }
